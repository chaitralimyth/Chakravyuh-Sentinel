services:
  - type: web
    name: chakravyuh-sentinel-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chakravyuh-db
          property: connectionString
      - key: SESSION_TIMEOUT_MINUTES
        value: 30
      - key: SESSION_EVAL_THRESHOLD
        value: 5
      - key: BLOCK_DURATION_MINUTES
        value: 60
      - key: CORS_ORIGINS
        value: https://chakravyuh-sentinel.netlify.app,https://singhaman.me
    healthCheckPath: /

databases:
  - name: chakravyuh-db
    databaseName: chakravyuh_sentinel